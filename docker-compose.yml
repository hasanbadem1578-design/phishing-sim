version: "3.9"

services:
  backend:
    build: ./backend
    ports:
      - "5000:5000"
    environment:
      - USE_MEMORY_MAIL=false
      - SMTP_HOST=mailhog
      - SMTP_PORT=1025
      - BASE_URL=http://localhost:5000
    depends_on:
      - mailhog

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

  mailhog:
    image: mailhog/mailhog
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI
